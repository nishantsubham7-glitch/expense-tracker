<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Expense Tracker</h1>
      <p>Track your daily income, expenses, and remaining balance.</p>
    </header>

    <section class="summary-grid" aria-label="Financial summary">
      <div class="summary-card balance-card">
        <span>Total Balance</span>
        <strong id="total-balance">₹0.00</strong>
      </div>
      <div class="summary-card income-card">
        <span>Total Income</span>
        <strong id="total-income">₹0.00</strong>
      </div>
      <div class="summary-card expense-card">
        <span>Total Expense</span>
        <strong id="total-expense">₹0.00</strong>
      </div>
    </section>

    <section class="form-section" aria-label="Add transaction">
      <h2>Add New Transaction</h2>
      <form id="transaction-form">
        <div class="form-row">
          <div class="form-group">
            <label for="title">Title</label>
            <input
              type="text"
              id="title"
              placeholder="e.g., Grocery shopping, Salary"
              required
            />
          </div>

          <div class="form-group">
            <label for="amount">Amount (₹)</label>
            <input
              type="number"
              id="amount"
              placeholder="0.00"
              step="0.01"
              min="0.01"
              required
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="type">Type</label>
            <select id="type" required>
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Bills">Bills</option>
              <option value="Shopping">Shopping</option>
              <option value="Salary">Salary</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-primary">Add Transaction</button>
      </form>
    </section>

    <section class="history-section" aria-label="Transaction history">
      <div class="history-header">
        <h2>Transaction History</h2>
        <div class="history-controls">
          <select id="filter-category" aria-label="Filter by category">
            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Bills">Bills</option>
            <option value="Shopping">Shopping</option>
            <option value="Salary">Salary</option>
            <option value="Other">Other</option>
          </select>
          <button type="button" id="clear-all-btn" class="btn-secondary">
            Clear All
          </button>
        </div>
      </div>

      <ul id="transaction-list" class="transaction-list">
        <li class="empty-state">No transactions yet. Add one above to get started.</li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
